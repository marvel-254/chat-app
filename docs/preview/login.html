<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BRO — sign in (design preview)</title>
<style>
  @font-face { font-family: 'Space Grotesk'; font-weight: 400; src: url('../../assets/fonts/space_grotesk/SpaceGrotesk-Regular.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url('../../assets/fonts/space_grotesk/SpaceGrotesk-Medium.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'Space Grotesk'; font-weight: 600; src: url('../../assets/fonts/space_grotesk/SpaceGrotesk-SemiBold.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('../../assets/fonts/space_grotesk/SpaceGrotesk-Bold.ttf') format('truetype'); font-display: swap; }

  :root{
    --bg:#121318; --surface-low:#0D0E13; --surface-high:#292A2F;
    --border:#444932; --text:#E3E1E9; --muted:#C5C9AC;
    --volt:#D4FF00; --dark:#0C0D12; --error:#FF8D8D;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh; overflow-x:hidden;
  }

  /* ── atmosphere: volt aurora, olive bloom, grain, vignette ───────────── */
  .backdrop{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .backdrop::before{
    content:""; position:absolute; width:640px; height:640px; right:-220px; top:-260px;
    background:radial-gradient(circle at 50% 50%, rgba(212,255,0,.155) 0%, rgba(212,255,0,.05) 52%, transparent 72%);
  }
  .backdrop::after{
    content:""; position:absolute; width:720px; height:700px; left:-260px; bottom:-330px;
    background:radial-gradient(circle at 50% 50%, rgba(58,66,36,.62) 0%, rgba(35,36,27,.42) 55%, transparent 74%);
  }
  .grain{position:absolute; inset:0; background-image:url('../../assets/images/noise_tile.png'); opacity:.5}

  /* ── the prop: the background of the whole page ───────────────────────── */
  .prop-bg{position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden}
  .prop-bg img{
    position:absolute; right:-4vw; bottom:-2vh; height:103vh; width:auto;
    transform:scaleX(-1);           /* mirrored so she faces back into the form */
    -webkit-user-select:none; user-select:none;
  }
  .prop-bg .scrim{
    position:absolute; inset:0;
    background:linear-gradient(90deg,
      #121318 0%, #121318 34%, rgba(18,19,24,.88) 52%,
      rgba(18,19,24,.45) 72%, rgba(18,19,24,.05) 92%, rgba(18,19,24,0) 100%);
  }
  .prop-bg.no-prop::after{
    content:'prop_mascot.webp did not load'; position:absolute; top:50%; right:8%;
    transform:translateY(-50%); font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--error);
  }

  /* ── content: copy + form in one column, art keeps the right ──────────── */
  .shell{
    position:relative; z-index:2; width:100%; max-width:940px; margin:0 auto;
    min-height:100dvh; display:flex; align-items:center;
    padding:24px 24px 28px;
  }
  .content{width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center}
  .copy{display:flex; flex-direction:column; align-items:center; min-width:0; text-align:center}

  .eyebrow{
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 11px; border-radius:20px;
    background:rgba(41,42,47,.8); border:1px solid rgba(68,73,50,.8);
    font-size:9px; font-weight:700; letter-spacing:1.05px; text-transform:uppercase;
    color:var(--muted); white-space:nowrap;
  }
  .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--volt);display:block}
  h1{
    margin:10px 0 0; font-size:28px; line-height:1.02; letter-spacing:-.8px;
    font-weight:700; max-width:20ch;
  }
  .copy p{margin:6px 0 0; font-size:12px; color:var(--muted)}

  /* ── form ─────────────────────────────────────────────────────────────── */
  .form{width:100%; max-width:420px; margin-top:28px}
  .toggle{display:flex; padding:4px; border-radius:40px; background:var(--surface-low); border:1px solid var(--border)}
  .toggle button{
    flex:1; padding:12px 0; border:0; border-radius:36px; cursor:pointer;
    background:transparent; color:var(--muted); font:700 14px 'Space Grotesk',sans-serif;
    transition:background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .toggle button.active{background:var(--volt); color:var(--dark); box-shadow:0 0 16px rgba(212,255,0,.30)}

  .spacer-24{height:24px}
  .field + .field{margin-top:16px}
  .field label{
    display:block; padding:0 4px 8px; color:var(--muted);
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  }
  .input{
    height:54px; display:flex; align-items:center; gap:10px;
    padding:0 6px 0 18px; border-radius:28px;
    background:var(--surface-low); border:1px solid var(--border);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input:focus-within{border-color:var(--volt); box-shadow:0 0 16px rgba(212,255,0,.12)}
  .input svg{width:20px;height:20px;flex:none;color:var(--muted)}
  .input input{
    flex:1; min-width:0; height:100%; border:0; outline:0; background:none;
    color:var(--text); font:400 15px 'Space Grotesk',sans-serif;
  }
  .input input::placeholder{color:rgba(197,201,172,.6)}
  .eye{width:44px;height:44px;display:grid;place-items:center;flex:none;background:none;border:0;color:var(--muted);cursor:pointer;border-radius:50%}
  .eye:hover{color:var(--text)}
  .helper{padding:6px 14px 0; font-size:12px; color:var(--muted)}

  .forgot{display:flex; justify-content:flex-end; align-items:center; margin-top:2px; height:32px}
  .forgot a{font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; padding:6px 8px; border-radius:8px}
  .forgot a:hover{color:var(--text)}

  .cta{
    width:100%; height:54px; margin-top:8px; border:0; border-radius:27px; cursor:pointer;
    background:var(--volt); color:var(--dark);
    font:700 16px 'Space Grotesk',sans-serif; letter-spacing:.3px;
    box-shadow:0 0 22px 1px rgba(212,255,0,.32);
    transition:filter .15s ease, box-shadow .15s ease, transform .06s ease;
  }
  .cta:hover{filter:brightness(1.04)}
  .cta:active{transform:translateY(1px); box-shadow:0 0 14px 0 rgba(212,255,0,.28)}

  .switch{margin-top:16px; text-align:center; font-size:14px; color:var(--muted)}
  .switch button{background:none;border:0;padding:0;cursor:pointer;font:400 14px 'Space Grotesk',sans-serif;color:var(--muted)}
  .switch b{color:var(--volt); font-weight:700}
  .foot{margin-top:4px; text-align:center; font-size:11px; line-height:1.35; color:var(--muted)}

  /* ── entrance ─────────────────────────────────────────────────────────── */
  .enter{opacity:0; animation:enter .62s cubic-bezier(.22,.9,.24,1) both}
  .enter.d1{animation-delay:.04s}.enter.d2{animation-delay:.11s}
  .form.enter{animation-delay:.20s}
  @keyframes enter{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ .enter{animation:none; opacity:1} }

  /* ── phones / narrow: prop across the top, content centred ────────────── */
  @media (max-width: 900px){
    .prop-bg img{
      left:50%; right:auto; top:-2vh; bottom:auto; height:64vh; width:auto;
      transform:translateX(-50%); opacity:.8;
    }
    .prop-bg .scrim{
      background:linear-gradient(180deg,
        rgba(18,19,24,.55) 0%, rgba(18,19,24,.64) 38%,
        rgba(18,19,24,.92) 64%, #121318 78%);
    }
    .shell{padding:72px 20px 28px}
    .content{margin:0 auto}
  }

  /* ── short panes: tighten, never drop the prop ────────────────────────── */
  @media (max-height: 780px){
    .shell{padding:16px 24px 20px}
    h1{font-size:25px}
    .form{margin-top:20px}
    .spacer-24{height:18px}
    .field + .field{margin-top:12px}
    .switch{margin-top:12px}
  }
  @media (max-height: 660px){
    .eyebrow{display:none}
    h1{font-size:22px; letter-spacing:-.5px}
    .copy p{font-size:11px}
    .form{margin-top:14px}
    .input,.cta{height:48px}
    .cta{border-radius:24px}
    .forgot{height:28px}
    .foot{display:none}
  }
</style>
</head>
<body>
  <div class="backdrop"><div class="grain"></div></div>

  <div class="prop-bg" id="prop-bg">
    <img id="prop" src="../../assets/images/prop_mascot.webp" alt=""
         onerror="document.getElementById('prop-bg').classList.add('no-prop')" />
    <div class="scrim"></div>
  </div>

  <main class="shell">
    <div class="content">
      <div class="copy">
        <div class="eyebrow enter d1"><i></i>BRO&nbsp; · &nbsp;YOUR PEOPLE, CLOSER</div>
        <h1 id="headline" class="enter d2">Good to see you, Bro.</h1>
        <p id="subhead" class="enter d2">All your conversations, right here.</p>
      </div>

      <div class="form enter">
        <div class="toggle" role="tablist" aria-label="Sign in or create an account">
          <button id="tab-signin" class="active" role="tab" aria-selected="true">Sign In</button>
          <button id="tab-signup" role="tab" aria-selected="false">Create Account</button>
        </div>

        <div class="spacer-24"></div>

        <div class="field" id="username-field" hidden>
          <label for="username">What They Call You</label>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.8-1.4 1.9-2 3-2s2.2.6 3 2"/><path d="M15 10h4M15 14h3"/></svg>
            <input id="username" type="text" placeholder="alex_vance" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0V12a10 10 0 1 0-3.4 7.4"/></svg>
            <input id="email" type="email" placeholder="you@bro.network" autocomplete="email" />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V8a4 4 0 0 1 8 0v2"/></svg>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
            <button class="eye" id="eye" type="button" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
          </div>
          <div class="helper" id="pw-helper" hidden>At least 6 characters.</div>
        </div>

        <div class="forgot" id="forgot"><a href="#" onclick="return false">Forgot password?</a></div>

        <button class="cta" id="cta">Sign In</button>

        <div class="switch">
          <button id="switch"><span id="switch-lead">Need an account? </span><b id="switch-link">Claim Your Tag</b></button>
        </div>

        <div class="foot">By stepping in, you rep the Bro Code.</div>
      </div>
    </div>
  </main>

<script>
  const tabSignIn = document.getElementById('tab-signin');
  const tabSignUp = document.getElementById('tab-signup');
  const usernameField = document.getElementById('username-field');
  const forgot = document.getElementById('forgot');
  const cta = document.getElementById('cta');
  const switchBtn = document.getElementById('switch');
  const switchLead = document.getElementById('switch-lead');
  const switchLink = document.getElementById('switch-link');
  const headline = document.getElementById('headline');
  const subhead = document.getElementById('subhead');
  const pwHelper = document.getElementById('pw-helper');
  const email = document.getElementById('email');
  const password = document.getElementById('password');

  let signUp = false;

  function render() {
    tabSignIn.classList.toggle('active', !signUp);
    tabSignUp.classList.toggle('active', signUp);
    tabSignIn.setAttribute('aria-selected', String(!signUp));
    tabSignUp.setAttribute('aria-selected', String(signUp));
    usernameField.hidden = !signUp;
    forgot.style.visibility = signUp ? 'hidden' : 'visible';
    forgot.style.height = signUp ? '24px' : '32px';
    pwHelper.hidden = !signUp;
    cta.textContent = signUp ? 'Create Account' : 'Sign In';
    switchLead.textContent = signUp ? 'Already in the crew? ' : 'Need an account? ';
    switchLink.textContent = signUp ? 'Sign In, Bro' : 'Claim Your Tag';
    headline.innerHTML = signUp ? 'Your people.<br>Your place.' : 'Good to see you, Bro.';
    subhead.textContent = signUp
      ? 'Make room for the conversations that matter.'
      : 'All your conversations, right here.';
    password.setAttribute('autocomplete', signUp ? 'new-password' : 'current-password');
  }

  tabSignIn.addEventListener('click', () => { signUp = false; render(); });
  tabSignUp.addEventListener('click', () => { signUp = true; render(); });
  switchBtn.addEventListener('click', () => { signUp = !signUp; render(); });

  document.getElementById('eye').addEventListener('click', (e) => {
    const shown = password.type === 'text';
    password.type = shown ? 'password' : 'text';
    e.currentTarget.setAttribute('aria-label', shown ? 'Show password' : 'Hide password');
  });

  cta.addEventListener('click', () => {
    const ok = /.+@.+\..+/.test(email.value.trim());
    if (!ok) {
      email.closest('.input').style.borderColor = 'var(--error)';
      email.closest('.input').style.boxShadow = '0 0 16px rgba(255,141,141,.12)';
      email.focus();
    } else {
      email.closest('.input').style.borderColor = '';
      email.closest('.input').style.boxShadow = '';
      cta.textContent = 'Connecting…';
      setTimeout(() => { cta.textContent = signUp ? 'Create Account' : 'Sign In'; }, 900);
    }
  });
</script>
</body>
</html>
