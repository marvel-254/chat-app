name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [analyze, test, web, android]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        if: matrix.check == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Run Flutter ${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: |
          case "$CHECK" in
            analyze) task=(flutter analyze --no-fatal-infos --no-fatal-warnings) ;;
            test) task=(flutter test --reporter expanded) ;;
            web) task=(./scripts/build.sh web) ;;
            android) task=(flutter build apk --debug) ;;
          esac
          set +e
          "${task[@]}" 2>&1 | tee "$RUNNER_TEMP/flutter-$CHECK.txt"
          result=${PIPESTATUS[0]}
          if [[ "$result" != 0 ]]; then
            awk '/^[[:space:]]*error[[:space:]]|Error:|\[E\]/ && count++ < 20 { print "::error::" $0 }' "$RUNNER_TEMP/flutter-$CHECK.txt"
            tail -n 8 "$RUNNER_TEMP/flutter-$CHECK.txt" | sed 's/^/::notice::/'
          fi
          exit "$result"
  calls-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.17
      - run: node supabase/tests/bro_calls_push.mjs
      - run: node --test supabase/tests/web_push_worker.test.mjs
      - run: deno check supabase/functions/call-turn/index.ts supabase/functions/push-new-message/index.ts
      - run: deno test supabase/functions/call-turn supabase/functions/push-new-message
