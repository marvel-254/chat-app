name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Flutter (${{ matrix.filter }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: suggest_friends_screen
            filter: people appear
          - suite: suggest_friends_screen
            filter: submitted searches
          - suite: status_viewer
            filter: each status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Test
        env:
          SUITE: ${{ matrix.suite }}
          FILTER: ${{ matrix.filter }}
        run: flutter test "test/${SUITE}_test.dart" --plain-name "$FILTER"
