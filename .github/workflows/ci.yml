name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix checks --ignore-scripts && node --test checks/*.test.cjs checks/*.test.mjs
      - run: flutter build web --release
      - run: flutter build apk --debug

  database-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Fresh runner, no project link or production credentials.
      - run: supabase db start
