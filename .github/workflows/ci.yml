name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Flutter (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [suggest_friends_screen, status_viewer, people_search_history, error_and_search, message_outbox, status_feed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Test
        run: flutter test test/${{ matrix.suite }}_test.dart
