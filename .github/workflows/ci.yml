name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
        working-directory: .
      - name: Analyze
        run: flutter analyze
        working-directory: .
      - name: Test
        run: flutter test
        working-directory: .
