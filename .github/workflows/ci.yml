name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: History (${{ matrix.checkpoint }})
    strategy:
      fail-fast: false
      matrix:
        checkpoint: [open, replay, reopen, clear]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Test
        env:
          CHECKPOINT: ${{ matrix.checkpoint }}
        run: flutter test test/suggest_friends_screen_test.dart --plain-name 'recent searches can be replayed' --dart-define="RECENT_CHECKPOINT=$CHECKPOINT"
