name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment.
permissions:
  contents: read
  pages: write      # to upload a website
  id-token: write   # to verify the deployment originates from this source
  actions: write    # to remove stale same-named Pages artifacts before upload

# Allow one concurrent deployment; skip queued runs when a newer one starts.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Build Web (Landing + PWA at /app/)
        env:
          # Browser client settings are public Supabase values (never a service-role key).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_SENDER_ID: ${{ vars.FIREBASE_WEB_SENDER_ID }}
          FIREBASE_WEB_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ vars.FIREBASE_WEB_VAPID_KEY }}
          BASE_HREF: /chat-app/app/
        run: |
          test "$SUPABASE_URL" = 'https://dbfgyehzgrmsajpwydps.supabase.co'
          test -n "$SUPABASE_ANON_KEY"
          ./scripts/build.sh web

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: omix-systems
          SENTRY_PROJECT: bro
        run: |
          set -euo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN:-}" ]]; then
            echo "::notice::SENTRY_AUTH_TOKEN is not set; skipping source map upload"
            exit 0
          fi
          VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          RELEASE="bro@${VERSION:-dev}"
          DIST="${VERSION##*+}"
          test -s build/web/app/main.dart.js.map
          npx --yes @sentry/cli@3.8.2 sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --release "$RELEASE" \
            --dist "$DIST" \
            build/web/app

      - name: Add SPA fallback for client-side routing at /app/
        # Flutter uses hash-free routing (e.g. /chat-app/app/chat/<id>). GitHub Pages serves
        # a custom 404.html for unknown paths. Copy the PWA index.html to 404.html
        # so a deep link or refresh loads the app.
        run: cp build/web/app/index.html build/web/app/404.html

      - name: Verify structure
        run: |
          ls -la build/web/
          ls -la build/web/app/
          head -3 build/web/index.html
          head -3 build/web/app/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove stale Pages artifacts
        # deploy-pages@v4 can report "Found 0 artifact(s)" when older runs left
        # another artifact with the same name. Keep only the current upload.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null
              echo "Removed stale Pages artifact $id."
            done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Wait for Pages artifact metadata
        # actions/deploy-pages@v4 sometimes sees 0 artifacts immediately after
        # upload-pages-artifact succeeds. Poll the run API until the artifact is
        # visible before handing over to the deploy step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo "Pages artifact visible after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Artifact metadata not visible yet (attempt ${attempt}); retrying in 10s."
            sleep 10
          done
          echo "Pages artifact never became visible."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
