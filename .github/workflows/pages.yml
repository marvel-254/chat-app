name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment.
permissions:
  contents: read
  pages: write      # to upload a website
  id-token: write   # to verify the deployment originates from this source

# Allow one concurrent deployment; skip queued runs when a newer one starts.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Build Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=BUILD_NUMBER="${{ github.run_number }}"

      - name: Add SPA fallback for client-side routing
        # Flutter uses hash-free routing (e.g. /chat/<id>). GitHub Pages does NOT
        # support the Netlify-style 200.html fallback; it serves a custom 404.html
        # for unknown paths. Copy index.html to 404.html so a deep link or refresh
        # loads the app, whose router then redirects to a valid route.
        run: cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
