<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BRO — a calmer place for your conversations, voice notes, and the people who make your day.">

  <!-- iOS meta tags & branded icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BRO">
  <link rel="canonical" href="https://bro.omixsystems.store/app/">
  <link rel="icon" type="image/svg+xml" href="assets/branding/bro/logo.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph -->
  <meta property="og:site_name" content="BRO">
  <meta property="og:title" content="BRO — Talk like you mean it">
  <meta property="og:description" content="A calmer place for your conversations, voice notes, and the people who make your day.">
  <meta property="og:url" content="https://bro.omixsystems.store/app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://bro.omixsystems.store/assets/og/bro-social-preview.png">
  <meta property="og:image:secure_url" content="https://bro.omixsystems.store/assets/og/bro-social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BRO — Less noise. More you. A calmer place for private conversations.">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BRO — Talk like you mean it">
  <meta name="twitter:description" content="A calmer place for your conversations, voice notes, and the people who make your day.">
  <meta name="twitter:image" content="https://bro.omixsystems.store/assets/og/bro-social-preview.png">
  <meta name="twitter:image:alt" content="BRO — Less noise. More you. A calmer place for private conversations.">

  <title>BRO — Talk like you mean it</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app-root { height: 100%; width: 100%; overflow: hidden; }
    body { background: #08090D; color: #F5F4F8; font-family: 'Geist', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .app-loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 24px; }
    .app-loading svg { width: 48px; height: 48px; animation: spin 1s linear infinite; color: #D4FF00; }
    .app-loading p { color: #A8A5B8; font-size: 14px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-root">
    <div class="app-loading" role="status" aria-label="Loading BRO">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
        <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1" stroke-dasharray="31.4 31.4" stroke-dashoffset="0"/>
      </svg>
      <p>Loading BRO…</p>
    </div>
  </div>

  <!--
    This script bootstraps the Flutter application. You can customize it
    to provide a custom configuration to the Flutter loader or to give
    the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="assets/assets/crypto/openpgp.min.js"></script>
  <script src="assets/assets/crypto/bridge.js"></script>
  <script src="notice-client.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the static loader once Flutter has painted its first frame.
    function hideFlutterLoader() {
      var root = document.getElementById('app-root');
      if (root) root.remove();
    }
    window.addEventListener('flutter-first-frame', hideFlutterLoader);
    new MutationObserver(function () {
      if (document.querySelector('flutter-view')) hideFlutterLoader();
    }).observe(document.body, { childList: true, subtree: true });
  </script>
  <script>
    // Register PWA service worker for offline caching.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').then(function (reg) {
          console.log('BRO service worker registered:', reg.scope);
        }).catch(function (err) {
          console.warn('BRO service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
