<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chat App – Real-time messaging built with Flutter.">
<meta name="keywords" content="chat, messaging, flutter, real-time, web app">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<!-- Open Graph -->
<meta property="og:title" content="Chat App">
<meta property="og:description" content="Real-time messaging web app built with Flutter.">
<meta property="og:image" content="icons/Icon-512.png">
<meta property="og:url" content="https://example.com/">
<meta property="og:type" content="website">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chat App">
<meta name="twitter:description" content="Real-time messaging web app built with Flutter.">
<meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="chat_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chat App – Real-time Messaging</title>
  <link rel="manifest" href="manifest.json">
<link rel="canonical" href="https://example.com/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Chat App",
  "description": "Real-time messaging web app built with Flutter.",
  "url": "https://example.com/",
  "applicationCategory": "Communication",
  "operatingSystem": "Web"
}
</script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="loading" style="position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;z-index:9999;">
  Loading...
</div>
<script src="flutter_bootstrap.js" async></script>
<script>
  // Hide the loading overlay once Flutter is ready
  window.addEventListener('flutter-first-frame', function () {
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
  });
</script>
</body>
</html>
