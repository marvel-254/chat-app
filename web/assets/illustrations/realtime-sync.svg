<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="syncCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151622" />
      <stop offset="100%" stop-color="#0E0F17" />
    </linearGradient>
    <radialGradient id="syncGlow" cx="230" cy="160" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8C0" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#67E8C0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7764FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#67E8C0" />
      <stop offset="100%" stop-color="#7764FF" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="460" height="320" rx="20" fill="#11121C" stroke="#26273B" stroke-width="1.5" />
  <circle cx="230" cy="160" r="140" fill="url(#syncGlow)" />

  <!-- Live Sync Waveform Track -->
  <path d="M 40 160 C 100 160 120 120 160 120 C 200 120 220 200 260 200 C 300 200 320 160 420 160" 
        stroke="url(#pulseLine)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.65" />

  <!-- Central Realtime Broadcast Node -->
  <g transform="translate(180, 110)">
    <circle cx="50" cy="50" r="48" fill="#151622" stroke="#26273B" stroke-width="2" />
    <circle cx="50" cy="50" r="36" fill="rgba(103, 232, 192, 0.08)" stroke="#67E8C0" stroke-width="2" />
    
    <!-- Sync arrows -->
    <path d="M 42 42 L 50 34 L 58 42 M 50 36 V 56" fill="none" stroke="#67E8C0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 58 58 L 50 66 L 42 58 M 50 64 V 44" fill="none" stroke="#7764FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Left: Live Typing Indicator Pill -->
  <g transform="translate(40, 50)">
    <rect width="160" height="52" rx="14" fill="#151622" stroke="#26273B" stroke-width="1.2" />
    <circle cx="24" cy="26" r="12" fill="#7764FF" />
    <text x="24" y="30" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">K</text>
    
    <text x="44" y="22" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#A9A6BC">Kai is typing</text>
    <!-- 3 bouncing dots -->
    <circle cx="48" cy="34" r="2.5" fill="#67E8C0" />
    <circle cx="56" cy="34" r="2.5" fill="#67E8C0" opacity="0.7" />
    <circle cx="64" cy="34" r="2.5" fill="#67E8C0" opacity="0.4" />
  </g>

  <!-- Right: Verified Read Receipt Pill -->
  <g transform="translate(260, 218)">
    <rect width="160" height="52" rx="14" fill="#151622" stroke="#26273B" stroke-width="1.2" />
    <circle cx="26" cy="26" r="12" fill="rgba(103, 232, 192, 0.15)" stroke="#67E8C0" stroke-width="1.5" />
    <!-- Double checkmarks -->
    <path d="M 20 26 L 24 30 L 32 21" fill="none" stroke="#67E8C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 25 26 L 28 30 L 35 22" fill="none" stroke="#67E8C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <text x="46" y="23" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#F2F1F8">Read Receipt</text>
    <text x="46" y="36" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#67E8C0">Delivered • Seen now</text>
  </g>
</svg>
